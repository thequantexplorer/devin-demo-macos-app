name: Pomodoro
options:
  bundleIdPrefix: dev.devinworkshop
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  PomodoroCore:
    path: PomodoroCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Pomodoro:
    type: application
    platform: macOS
    sources: [Pomodoro]
    dependencies:
      - package: PomodoroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devinworkshop.Pomodoro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pomodoro
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  PomodoroUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [PomodoroUITests]
    dependencies:
      - target: Pomodoro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devinworkshop.PomodoroUITests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pomodoro
schemes:
  Pomodoro:
    build:
      targets:
        Pomodoro: all
        PomodoroUITests: [test]
    test:
      targets:
        - PomodoroUITests
        - package: PomodoroCore/PomodoroCoreTests
